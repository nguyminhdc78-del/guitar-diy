; PlatformIO Project Configuration - uMIC ESP32-S3 WiFi microphone
; Board: ESP32-S3 devkit with the FH4R2 chip variant (4MB quad flash + 2MB quad PSRAM,
; both embedded), INMP441 I2S mic. Detected with `esptool flash-id` on the bench board.
; For an N16R8 module (16MB QIO flash + 8MB Octal PSRAM) change the 4 lines marked N16R8.
;
; Platform: pioarduino fork = Arduino-ESP32 core 3.x (ESP-IDF 5.x) which ships the
; modern `driver/i2s_std.h`. The official `espressif32` platform is stuck on core 2.0.x
; and does NOT compile this project. The platform is pinned to a release for reproducible
; builds (tested with 55.03.311 = Arduino core 3.3.11). To follow the newest release use:
;   https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
;
; Environments:
;   mic      -> full firmware: SoftAP `uMIC` + TCP stream on 192.168.4.1:5000   (default)
;   vu-test  -> no WiFi, prints a serial dBFS VU meter to verify mic wiring / MIC_SHIFT_BITS
; Flash:  pio run -e vu-test -t upload   |   pio run -e mic -t upload   |   pio device monitor
;
; Serial: ARDUINO_USB_CDC_ON_BOOT=1 routes `Serial` to the native "USB" connector
; (VID:PID 303A:1001, the port used on this bench). If you plug the "UART"/"COM"
; connector instead, remove that flag so logs go to UART0 (the USB-JTAG port still flashes).

[platformio]
default_envs = mic

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino
; Flash/PSRAM wiring of the chip. Wrong memory_type => PSRAM not found at boot; wrong
; flash_size/partitions => "partition ... exceeds flash chip size" boot loop.
board_build.arduino.memory_type = qio_qspi   ; N16R8: qio_opi
board_build.flash_size = 4MB                 ; N16R8: 16MB
board_upload.flash_size = 4MB                ; N16R8: 16MB
board_build.partitions = huge_app.csv        ; N16R8: default_16MB.csv (huge_app = 3MB app, no OTA)
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=2
    ; logs on the native USB port (see note above); the board json already sets ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; INMP441 wiring (L/R pin -> GND selects the LEFT slot)
    -D MIC_PIN_SCK=3
    -D MIC_PIN_WS=4
    -D MIC_PIN_SD=5
    ; 32-bit I2S word -> int16: >>16 = 0 dB, >>14 = +12 dB gain (tune with vu-test)
    -D MIC_SHIFT_BITS=14
    ; On-board RGB LED (WS2812). 48 on official devkits, 38 on some clones, -1 = disabled
    -D LED_PIN=48
    ; Momentary record button between this GPIO and GND (internal pull-up), -1 = none
    -D BUTTON_PIN=7
    ; Network defaults; override e.g. -D AP_PASS='"secret123"' (keep the inner quotes)
    ; -D AP_SSID='"uMIC"' -D AP_PASS='"umic12345"' -D AP_CHANNEL=6

[env:mic]
build_flags = ${env.build_flags}

[env:vu-test]
build_flags = ${env.build_flags} -D VU_METER_ONLY=1
